name: SecureVault CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ─── Job 1: Lint & Test ────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run syntax lint
        run: npm run lint

      - name: Run test suite
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: mongodb://127.0.0.1:27017/securevault_test
          JWT_SECRET: ci-test-jwt-secret-not-for-production-use
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: 3310
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          EMAIL_HOST: smtp.mailtrap.io
          EMAIL_PORT: 2525
          EMAIL_USER: ci-user
          EMAIL_PASS: ci-pass
        run: npm test

      - name: Upload test results (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            *.log
            logs/

  # ─── Job 2: Docker Build Verification ─────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: securevault:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 3: Container health check using built image ----------------------
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: docker-build
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image for health check
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: securevault:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and wait for health endpoint
        run: |
          docker run -d --name securevault-health -p 5000:5000 \
            -e PORT=5000 \
            -e MONGO_URI=mongodb://mongodb:27017/securevault_test \
            -e JWT_SECRET=ci-test-jwt-secret-not-for-production-use \
            -e ENCRYPTION_KEY=0123456789abcdef0123456789abcdef \
            -e REDIS_HOST=redis \
            -e REDIS_PORT=6379 \
            -e CLAMAV_HOST=clamav \
            -e CLAMAV_PORT=3310 \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e AWS_REGION=${{ secrets.AWS_REGION }} \
            -e AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }} \
            -e EMAIL_HOST=smtp.mailtrap.io \
            -e EMAIL_PORT=2525 \
            -e EMAIL_USER=ci-user \
            -e EMAIL_PASS=ci-pass \
            securevault:${{ github.sha }}
          for i in {1..30}; do
            if curl -sSf http://localhost:5000/health; then
              echo "Health check passed";
              exit 0;
            fi
            echo "Waiting for health endpoint... ($i)";
            sleep 2;
          done
          docker logs securevault-health || true
          docker stop securevault-health
          exit 1
        shell: bash

  # ─── Job 4: Publish Docker image (only on push to main/master) ────────────
  publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/securevault:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/securevault:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
