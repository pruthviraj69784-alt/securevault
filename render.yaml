version: "1"
projects:
  - name: My project
    environments:
      - name: Production
        services:
          - type: web
            name: securevault-api
            runtime: node
            repo: https://github.com/pruthviraj69784-alt/securevault
            plan: free
            region: oregon
            rootDir: SecureVault
            buildCommand: npm install && npx prisma generate && npx prisma db push
            startCommand: npm start
            autoDeployTrigger: commit
            envVars:
              - key: NODE_ENV
                value: production
              - key: CORS_ORIGIN
                sync: false
              - key: AWS_REGION
                value: ap-southeast-2
              - key: AWS_BUCKET_NAME
                value: securevault-storage
              - key: AWS_ACCESS_KEY_ID
                sync: false
              - key: AWS_SECRET_ACCESS_KEY
                sync: false
              - key: JWT_SECRET
                sync: false
              - key: JWT_EXPIRES_IN
                value: 7d
              - key: ENCRYPTION_KEY
                sync: false
              - key: REDIS_URL
                fromService:
                  name: securevault-redis
                  type: keyvalue
                  property: connectionString
              - key: DATABASE_URL
                fromDatabase:
                  name: securevault-db
                  property: connectionString

          - type: web
            name: securevault-app
            runtime: static
            repo: https://github.com/pruthviraj69784-alt/securevault
            plan: free
            region: oregon
            rootDir: frontend
            buildCommand: npm install && npm run build
            staticPublishPath: dist
            autoDeployTrigger: commit
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            envVars:
              - key: VITE_API_BASE_URL
                sync: false

          - type: keyvalue
            name: securevault-redis
            plan: free
            region: oregon
            maxmemoryPolicy: allkeys-lru
            persistenceMode: "off"
            ipAllowList: []

        databases:
          - name: securevault-db
            databaseName: securevault_yv2b
            user: securevault_yv2b_user
            plan: free
            region: oregon
            ipAllowList:
              - source: 0.0.0.0/0
                description: everywhere
            postgresMajorVersion: "16"
