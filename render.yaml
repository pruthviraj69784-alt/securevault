databases:
  - name: securevault-db
    databaseName: securevault
    user: securevault_user
    plan: free
    region: oregon

services:
  # ─── Redis / Key-Value Service ──────────────────────────────────────────────
  - type: redis
    name: securevault-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction

  # ─── Backend API Service ───────────────────────────────────────────────────
  - type: web
    name: securevault-api
    runtime: node
    plan: free
    region: oregon
    rootDir: SecureVault
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: securevault-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: securevault-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: AWS_REGION
        value: ap-southeast-2
      - key: AWS_BUCKET_NAME
        value: securevault-storage
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  # ─── Frontend Web App ──────────────────────────────────────────────────────
  - type: web
    name: securevault-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
